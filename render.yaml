services:
  - type: web
    name: n8n-miami
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: N8N_HOST
        value: n8n-miami.onrender.com
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://n8n-miami.onrender.com/
      - key: DB_TYPE
        value: sqlite
      - key: DB_SQLITE_DATABASE
        value: /home/node/.n8n/database.sqlite
      - key: GENERIC_TIMEZONE
        value: UTC
      - key: N8N_SECURE_COOKIE
        value: "true"
      # Security variables - you MUST update these after first deploy
      - key: N8N_ENCRYPTION_KEY
        generateValue: true  # Render will auto-generate this
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1

services:
  - type: web
    name: n8n-miami
    runtime: docker
    plan: free  # or starter/standard for paid
    autoDeploy: false
    envVars:
      - key: N8N_HOST
        value: n8n-miami.onrender.com
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://n8n-miami.onrender.com/
      - key: DB_TYPE
        value: sqlite
      - key: DB_SQLITE_DATABASE
        value: /home/node/.n8n/database.sqlite
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      # Critical for permissions
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "false"
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n  # ← CRITICAL! Must match n8n's data path
      sizeGB: 1
